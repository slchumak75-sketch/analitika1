# Автосборка RetailBreakEven — запускается АВТОМАТИЧЕСКИ при каждом push
# в любую ветку и при каждом Pull Request. См. docs/CI.md.
name: build

on:
  push:            # <-- сборка после внесения любых изменений
    branches: ['**']
  pull_request:    # <-- и при открытии/обновлении PR
  workflow_dispatch: {}  # ручной запуск из вкладки Actions

permissions:
  contents: read

jobs:
  test-and-build:
    name: Тесты и сборка (Linux + Windows .exe)
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Go (версия — из go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверка форматирования (gofmt)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Не отформатированы: $out"; gofmt -d .; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: |
          go test ./... -count=1 -run TestParseRealMirXLS -v 2>&1 | grep -E 'FAIL|\.go:|--- |panic|RUN|PASS|ok ' | head -9 | while IFS= read -r line; do echo "::warning ::TEST $line"; done
          test ${PIPESTATUS[0]} -eq 0

      - name: Сборка Linux-версии (проверка компиляции)
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/RetailBreakEven-linux-amd64 .

      - name: Сборка Windows .exe (основной продукт)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/RetailBreakEven.exe .

      - name: Загрузить артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: RetailBreakEven-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
